<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Metrodle, un joc web de coneixement sobre xarxes de metro."
    />
    <title>Metrodle</title>
    <script>
      try {
        const supportedLocales = ['ca', 'en', 'es']
        const normalizeLocale = (value) => {
          if (!value) return null
          const lower = value.toLowerCase()
          if (supportedLocales.includes(lower)) return lower
          const base = lower.split('-')[0]
          return supportedLocales.includes(base) ? base : null
        }
        const params = new URLSearchParams(window.location.search)
        const savedLocale = localStorage.getItem('metrodle:locale:v1')
        const browserLocale = navigator.languages?.[0] || navigator.language
        const locale =
          normalizeLocale(params.get('lang')) ||
          normalizeLocale(savedLocale) ||
          normalizeLocale(browserLocale) ||
          'ca'
        const savedTheme = localStorage.getItem('metrodle:theme:v1')
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.lang = locale
        document.documentElement.dir = 'ltr'
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : prefersDark
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
